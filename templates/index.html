<!DOCTYPE html>
<html>
<head>
    <title>AI Social Automation</title>
</head>
<body style="background:#111;color:white;font-family:Arial;padding:40px;">

<h1>AI Social Media Automation</h1>

<form method="POST">

    <input
        type="text"
        name="business_name"
        placeholder="Business Name"
        required
        style="padding:10px;width:300px;"
    >

    <br><br>

    <textarea
        name="services"
        placeholder="Services"
        required
        style="padding:10px;width:300px;height:100px;"
    ></textarea>

    <br><br>

    <button
        type="submit"
        style="padding:10px 20px;background:green;color:white;border:none;"
    >
        Generate Content
    </button>

</form>

</body>
</html>
